name: Build TWRP

# Credits to:
# https://github.com/TeamWin
# https://github.com/minimal-manifest-twrp
# https://github.com/wndelix/android_device_motorola_lamu_twrp
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal Manifest Branch'
        required: true
        default: 'twrp-14.1'
        type: choice
        options:
        - twrp-14.1
      DEVICE_TREE:
        description: 'TWRP Device Tree'
        required: true
        default: 'https://github.com/wndelix/android_device_motorola_lamu_twrp'
      DEVICE_TREE_BRANCH:
        description: 'TWRP Device Tree Branch'
        required: true
        default: 'twrp-14.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/motorola/lamu'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'lamu'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      USE_CCACHE:
        description: Use ccache for compilation
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build TWRP for ${{ inputs.DEVICE_NAME }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Build Environment
      run: |
        sudo apt install aria2 linux-modules-extra-$(uname -r) zram-tools -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh
        cd .. && rm -rf scripts
        # Garante que o comando `repo` esteja disponível
        if ! command -v repo >/dev/null 2>&1; then
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo
        fi
        # Redundant apt cleanup
        sudo apt autoclean >/dev/null || true
        sudo apt autoremove -qy 2>/dev/null || true
        sudo rm -rf /var/cache/apt/archives/ 2>/dev/null || true

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: '3072'

    - name: Checkout
      uses: actions/checkout@main

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      if: inputs.USE_CCACHE
      with:
        max-size: "2G"
        create-symlink: true

    - name: Setup zram
      run: |
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
        sudo systemctl restart zramswap
        zramctl

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/TWRP
        cd ${GITHUB_WORKSPACE}/TWRP
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git config --global color.ui false
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ inputs.MANIFEST_BRANCH }}
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/TWRP
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Building TWRP
      run: |
        cd ${GITHUB_WORKSPACE}/TWRP

        echo "=========================================="
        echo " DEBUG: task_profiles.json no source"
        echo "=========================================="

        echo "--- Arquivos encontrados ---"
        find . \
          \( -name "task_profiles.json" -o -name "task_profiles_*.json" \) \
          -not -path "./.repo/*" \
          -not -path "./out/*" \
          -print || true

        echo
        echo "--- Referências a task_profiles.json ---"
        grep -R "task_profiles.json" -n \
          --exclude-dir=.git \
          --exclude-dir=.repo \
          --exclude-dir=out \
          . 2>/dev/null || true

        echo
        echo "--- Referências a task_profiles_30.json ---"
        grep -R "task_profiles_30.json" -n \
          --exclude-dir=.git \
          --exclude-dir=.repo \
          --exclude-dir=out \
          . 2>/dev/null || true

        echo
        echo "=========================================="
        echo " DEBUG: configuração do dispositivo"
        echo "=========================================="

        echo "--- Device Tree ---"
        git -C "${{ inputs.DEVICE_PATH }}" status --short
        git -C "${{ inputs.DEVICE_PATH }}" log -1 --oneline

        echo
        echo "--- device.mk ---"
        if [[ -f "${{ inputs.DEVICE_PATH }}/device.mk" ]]; then
          sed -n '1,240p' "${{ inputs.DEVICE_PATH }}/device.mk"
        fi

        echo
        echo "--- BoardConfig.mk ---"
        if [[ -f "${{ inputs.DEVICE_PATH }}/BoardConfig.mk" ]]; then
          sed -n '1,280p' "${{ inputs.DEVICE_PATH }}/BoardConfig.mk"
        fi

        echo
        echo "=========================================="
        echo " BUILD"
        echo "=========================================="

        set +e

        if [[ ${{ inputs.USE_CCACHE }} == true ]]; then
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          if [[ -f build/soong/ui/build/sandbox_linux.go ]]; then
            sed -i 's/return sandboxConfig\.working/return false/g' \
              build/soong/ui/build/sandbox_linux.go
          fi
        fi

        rm -rf "${OUT_DIR:-out}"

        source build/envsetup.sh

        export ALLOW_MISSING_DEPENDENCIES=true

        lunch twrp_${{ inputs.DEVICE_NAME }}-ap2a-eng

        echo
        echo "=========================================="
        echo " DEBUG: PRODUCT_OUT"
        echo "=========================================="

        echo "OUT_DIR=${OUT_DIR:-out}"
        echo "PRODUCT_OUT=${PRODUCT_OUT:-não definido}"

        echo
        echo "--- task_profiles antes do build ---"
        find "${PRODUCT_OUT:-out/target/product/${{ inputs.DEVICE_NAME }}}" \
          -name "task_profiles*.json" \
          -print 2>/dev/null || true

        echo
        echo "=========================================="
        echo " EXECUTANDO BUILD"
        echo "=========================================="

        mka adbd ${{ inputs.BUILD_TARGET }}image
        BUILD_STATUS=$?

        echo
        echo "=========================================="
        echo " DEBUG: estado após o build"
        echo "=========================================="

        echo "--- task_profiles encontrados no OUT ---"
        find "${PRODUCT_OUT:-out/target/product/${{ inputs.DEVICE_NAME }}}" \
          -name "task_profiles*.json" \
          -print 2>/dev/null || true

        echo
        echo "--- caminho esperado pelo erro ---"
        EXPECTED="${PRODUCT_OUT:-out/target/product/${{ inputs.DEVICE_NAME }}}/system/etc/task_profiles.json"

        if [[ -f "$EXPECTED" ]]; then
          echo "ENCONTRADO: $EXPECTED"
          ls -lh "$EXPECTED"
        else
          echo "AUSENTE: $EXPECTED"
        fi

        echo
        echo "--- arquivos task_profiles no source e OUT ---"
        find . \
          \( -name "task_profiles.json" -o -name "task_profiles_*.json" \) \
          -not -path "./.repo/*" \
          -print 2>/dev/null || true

        echo
        echo "Build exit status: $BUILD_STATUS"

        exit $BUILD_STATUS

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=America/Sao_Paulo date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/TWRP

        # O nome do .img gerado varia conforme o target
        case "${{ inputs.BUILD_TARGET }}" in
          vendorboot) IMAGE_NAME="vendor_boot.img" ;;
          recovery)   IMAGE_NAME="recovery.img" ;;
          boot)       IMAGE_NAME="boot.img" ;;
        esac
        IMAGE_PATH="TWRP/out/target/product/${{ inputs.DEVICE_NAME }}/${IMAGE_NAME}"
        test -f "${GITHUB_WORKSPACE}/${IMAGE_PATH}"
        echo "IMAGE_PATH=${IMAGE_PATH}" >> $GITHUB_ENV

        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          ${{ env.IMAGE_PATH }}
        name: TWRP Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## TWRP Recovery Build - Unofficial
          Build: ${{ inputs.MANIFEST_BRANCH }}
          Target: ${{ inputs.BUILD_TARGET }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
